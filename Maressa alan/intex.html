<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja de Chuteiras</title>
<link rel="stylesheet" href="style.css">


</head>

<body>

<div class="cabecalho">

    <div>
        <img class="logo-loja" src="https://cdn-icons-png.flaticon.com/512/69/69524.png">
    </div>

    <div class="busca-cabecalho">
        <input type="text" placeholder="pesquise sua chuteira" class="busca-cabecalha">
    </div>

    <div>
        <a href="#chuteiras">
            <img class="icone-carrinho" src="https://cdn-icons-png.flaticon.com/512/53/53283.png">
        </a>
    </div>

    <div>
        <a href="#cadastro">
            <button class="botao-cadastrar">
                cadastrar
            </button>
        </a>
    </div>

</div>

<img src="https://wallpapercave.com/wp/wp3049846.jpg" class="banner-principal">

<div id="chuteiras">

    <div class="produtos">

        <div class="chuteira">
            <img src="https://jbsportspy.com/cdn/shop/files/63b02914.png?v=1737845397&width=1445">
            <h2>Nike Mercurial</h2>
            <h3>R$799,00</h3>
        </div>

        <div class="chuteira">
            <img src="https://static.wixstatic.com/media/5b78e5_5cedaed421e24e649b4b48ba5b81e4e0~mv2.jpg/v1/fill/w_980,h_653,al_c,q_85,usm_0.66_1.00_0.01,enc_auto/5b78e5_5cedaed421e24e649b4b48ba5b81e4e0~mv2.jpg">
            <h2>Puma Future</h2>
            <h3>R$599,00</h3>
        </div>

        <div class="chuteira">
            <img src="https://static3.tcdn.com.br/img/img_prod/311840/chuteira_penalty_max_1000_ecoknit_futsal_branca_103520_2_9c2039a9ae7122f22fea6692e2704447.jpg">
            <h2>Penalty Futsal</h2>
            <h3>R$299,00</h3>
        </div>

        <div class="chuteira">
            <img src="https://images.prodirectsport.com/ProductImages/Main/265204_Main_Thumb_1206429.jpg">
            <h2>Mizuno Morelia</h2>
            <h3>R$699,00</h3>
        </div>

    </div>

    <div class="produtos">

        <div class="chuteira">
            <img src="https://cdn.bnws3.com.br/b2online.com.br/image/cache/data/produtos/topper/chuteiras/chuteira-topper-society-maestro-td-iv-masculina-branco---preto-8538-23-07-04-01-1200x1200.jpg">
            <h2>Topper Society</h2>
            <h3>R$249,00</h3>
        </div>

        <div class="chuteira">
            <img src="https://images.prodirectsport.com/ProductImages/Gallery_5/247803_Gallery_5_1082586.jpg">
            <h2>Umbro Speciali</h2>
            <h3>R$399,00</h3>
        </div>

        <div class="chuteira">
            <img src="https://images.prodirectsport.com/ProductImages/Main/1026212_Main_1923911.jpg">
            <h2>Adidas Predator</h2>
            <h3>R$650,00</h3>
        </div>

        <div class="chuteira">
            <img src="https://www.futbolemotion.com/imagesarticulos/193448/grandes/zapatilla-joma-top-flex-rebound-pito-edition-blanco-verde-fluor-0.jpg">
            <h2>Joma Top Flex</h2>
            <h3>R$350,00</h3>
        </div>

    </div>

</div>

<br><br><br>

<div id="cadastro" class="cadastro">

    <div class="titulo-cadastro">
        <h2>Cadastro de Cliente</h2>
    </div>

    <div class="input-box">
        <input type="text" id="nome" name="nome"
        required placeholder="Digite seu nome">
    </div>

    <div class="input-box">
        <input type="email" id="email" name="email"
        placeholder="Digite seu email" required>
    </div>

    <div class="input-box input-box-senha">
        <input type="password" id="senha" name="senha"
        placeholder="Digite sua senha"
        minlength="6" required>

        <button class="botao">
            CONTINUAR
        </button>
    </div>

    <footer>Feito com muito amor por Maressa 1°t.i</footer>

</div>

</body>
</html>
